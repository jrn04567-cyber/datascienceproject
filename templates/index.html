<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Quality Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        .btn-predict {
            background-color: #722f37;
            border: none;
            color: white;
            padding: 10px 24px;
            font-weight: 600;
        }
        .btn-predict:hover {
            background-color: #59232a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: #722f37;">Wine Quality Prediction</h2>
                        <p class="text-muted">Enter wine chemical properties to predict quality score</p>
                    </div>

                    <form action="/predict" method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fixed_acidity" class="form-label">Fixed Acidity</label>
                                <input type="number" step="any" class="form-control" id="fixed_acidity" name="fixed_acidity" value="7.4" required>
                            </div>
                            <div class="col-md-6">
                                <label for="volatile_acidity" class="form-label">Volatile Acidity</label>
                                <input type="number" step="any" class="form-control" id="volatile_acidity" name="volatile_acidity" value="0.7" required>
                            </div>

                            <div class="col-md-6">
                                <label for="citric_acid" class="form-label">Citric Acid</label>
                                <input type="number" step="any" class="form-control" id="citric_acid" name="citric_acid" value="0.0" required>
                            </div>
                            <div class="col-md-6">
                                <label for="residual_sugar" class="form-label">Residual Sugar</label>
                                <input type="number" step="any" class="form-control" id="residual_sugar" name="residual_sugar" value="1.9" required>
                            </div>

                            <div class="col-md-6">
                                <label for="chlorides" class="form-label">Chlorides</label>
                                <input type="number" step="any" class="form-control" id="chlorides" name="chlorides" value="0.076" required>
                            </div>
                            <div class="col-md-6">
                                <label for="free_sulfur_dioxide" class="form-label">Free Sulfur Dioxide</label>
                                <input type="number" step="any" class="form-control" id="free_sulfur_dioxide" name="free_sulfur_dioxide" value="11.0" required>
                            </div>

                            <div class="col-md-6">
                                <label for="total_sulfur_dioxide" class="form-label">Total Sulfur Dioxide</label>
                                <input type="number" step="any" class="form-control" id="total_sulfur_dioxide" name="total_sulfur_dioxide" value="34.0" required>
                            </div>
                            <div class="col-md-6">
                                <label for="density" class="form-label">Density</label>
                                <input type="number" step="any" class="form-control" id="density" name="density" value="0.9978" required>
                            </div>

                            <div class="col-md-4">
                                <label for="pH" class="form-label">pH</label>
                                <input type="number" step="any" class="form-control" id="pH" name="pH" value="3.51" required>
                            </div>
                            <div class="col-md-4">
                                <label for="sulphates" class="form-label">Sulphates</label>
                                <input type="number" step="any" class="form-control" id="sulphates" name="sulphates" value="0.56" required>
                            </div>
                            <div class="col-md-4">
                                <label for="alcohol" class="form-label">Alcohol</label>
                                <input type="number" step="any" class="form-control" id="alcohol" name="alcohol" value="9.4" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-predict btn-lg">Predict Wine Quality</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
